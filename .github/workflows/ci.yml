name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    # Persistence tests need a real Postgres. The image creates the
    # ml_playground database; conftest.py connects to it over port 5433 to
    # CREATE the separate ml_playground_test database before the suite runs.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ml_playground
          POSTGRES_PASSWORD: ml_playground
          POSTGRES_DB: ml_playground
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ML_PLAYGROUND_TEST_DATABASE_URL: postgresql://ml_playground:ml_playground@127.0.0.1:5433/ml_playground_test
      ML_PLAYGROUND_ADMIN_DATABASE_URL: postgresql://ml_playground:ml_playground@127.0.0.1:5433/ml_playground

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Test
        working-directory: backend
        run: python -m pytest tests -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
